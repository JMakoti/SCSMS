
name: Release SCSMS Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish SCSMS
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $config = Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw |
            ConvertFrom-Json
          $expected = $config.version
          if ("${{ github.ref_type }}" -eq "tag") {
            $expected = $tag -replace '^v', ''
          }

          $desktopPackage = Get-Content "apps/desktop/package.json" -Raw | ConvertFrom-Json
          $webPackage = Get-Content "apps/web/package.json" -Raw | ConvertFrom-Json
          $syncApiPackage = Get-Content "apps/sync-api/package.json" -Raw | ConvertFrom-Json
          $databasePackage = Get-Content "database/package.json" -Raw | ConvertFrom-Json
          $rootPackage = Get-Content "package.json" -Raw | ConvertFrom-Json
          $cargoManifest = Get-Content "apps/desktop/src-tauri/Cargo.toml" -Raw
          $cargoVersion = [regex]::Match(
            $cargoManifest,
            '(?m)^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value

          $versions = [ordered]@{
            "Tauri config" = $config.version
            "Desktop Cargo manifest" = $cargoVersion
            "Desktop package" = $desktopPackage.version
            "Web package" = $webPackage.version
            "Sync API package" = $syncApiPackage.version
            "Database package" = $databasePackage.version
            "Root package" = $rootPackage.version
          }
          foreach ($entry in $versions.GetEnumerator()) {
            if ($entry.Value -ne $expected) {
              throw "$($entry.Key) version $($entry.Value) does not match release version $expected"
            }
          }

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm exec tauri
          tagName: v__VERSION__
          releaseName: SCSMS v__VERSION__
          releaseBody: |
            SCSMS desktop application release.

            Download the Windows installer from the assets below.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
